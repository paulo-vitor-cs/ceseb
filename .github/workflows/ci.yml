name: Build and deterministic tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake ninja-build libgl1-mesa-dev libxkbcommon-x11-dev libfontconfig1-dev
          cmake --version
          ninja --version
          g++-13 --version
      - name: Core before Qt
        run: |
          cmake -DCESEB_DEPS_ROOT=build/dependencies -DCESEB_DEPS_PLATFORM=linux -DCESEB_ACQUIRE_QT=OFF -P cmake/AcquireDependencies.cmake
          cmake -S . -B build/core-only -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DCESEB_SOURCE_REVISION="$GITHUB_SHA" -DCESEB_BUILD_GUI=OFF -DCESEB_BOOST_ROOT="$PWD/build/dependencies/boost_1_86_0" -DCMAKE_PREFIX_PATH="$PWD/build/dependencies/install"
          cmake --build build/core-only --parallel 2
          ctest --test-dir build/core-only --output-on-failure --no-tests=error --output-junit core-results.xml
      - name: GUI deterministic tests
        run: |
          cmake -DCESEB_DEPS_ROOT=build/dependencies -DCESEB_DEPS_PLATFORM=linux -DCESEB_ACQUIRE_QT=ON -P cmake/AcquireDependencies.cmake
          cmake -S . -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DCESEB_SOURCE_REVISION="$GITHUB_SHA" -DCESEB_BUILD_GUI=ON -DCESEB_BOOST_ROOT="$PWD/build/dependencies/boost_1_86_0" "-DCMAKE_PREFIX_PATH=$PWD/build/dependencies/Qt/6.12.0/gcc_64;$PWD/build/dependencies/install"
          cmake --build build/linux-release --parallel 2
          ctest --test-dir build/linux-release --output-on-failure --no-tests=error --output-junit gui-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-test-evidence
          path: |
            build/core-only/core-results.xml
            build/linux-release/gui-results.xml
            build/dependencies/acquisition-manifest.json
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Observe and select installed MSVC v143
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC v143 unavailable' }
          $setup = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          cmd /s /c "`"$setup`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }
      - name: Core before Qt and GUI tests
        shell: pwsh
        run: |
          function Invoke-Checked([scriptblock] $Command) { & $Command; if ($LASTEXITCODE -ne 0) { throw "Command failed: $Command" } }
          $deps = "$env:GITHUB_WORKSPACE/build/dependencies"
          Invoke-Checked { cmake --version }
          Invoke-Checked { ninja --version }
          Invoke-Checked { cmake "-DCESEB_DEPS_ROOT=$deps" -DCESEB_DEPS_PLATFORM=windows -DCESEB_ACQUIRE_QT=OFF -P cmake/AcquireDependencies.cmake }
          Invoke-Checked { cmake -S . -B build/core-only -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DCESEB_SOURCE_REVISION=$env:GITHUB_SHA" -DCESEB_BUILD_GUI=OFF "-DCESEB_BOOST_ROOT=$deps/boost_1_86_0" "-DCMAKE_PREFIX_PATH=$deps/install" }
          Invoke-Checked { cmake --build build/core-only --parallel 2 }
          Invoke-Checked { ctest --test-dir build/core-only --output-on-failure --no-tests=error --output-junit core-results.xml }
          Invoke-Checked { cmake "-DCESEB_DEPS_ROOT=$deps" -DCESEB_DEPS_PLATFORM=windows -DCESEB_ACQUIRE_QT=ON -P cmake/AcquireDependencies.cmake }
          Invoke-Checked { cmake -S . -B build/windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DCESEB_SOURCE_REVISION=$env:GITHUB_SHA" -DCESEB_BUILD_GUI=ON "-DCESEB_BOOST_ROOT=$deps/boost_1_86_0" "-DCMAKE_PREFIX_PATH=$deps/Qt/6.12.0/msvc2022_64;$deps/install" }
          Invoke-Checked { cmake --build build/windows-release --parallel 2 }
          $env:PATH = "$deps/Qt/6.12.0/msvc2022_64/bin;$env:PATH"
          Invoke-Checked { ctest --test-dir build/windows-release --output-on-failure --no-tests=error --output-junit gui-results.xml }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-evidence
          path: |
            build/core-only/core-results.xml
            build/windows-release/gui-results.xml
            build/dependencies/acquisition-manifest.json
